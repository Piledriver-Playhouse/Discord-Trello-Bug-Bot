# =============================================================================
# k8s/base/service.yaml — Bug Bot Webhook & Dashboard Service
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: bugbot
  namespace: bugbot
  labels:
    app: bugbot
spec:
  type: ClusterIP
  selector:
    app: bugbot
  ports:
    - name: webhook
      port: 80
      targetPort: 8080
      protocol: TCP
