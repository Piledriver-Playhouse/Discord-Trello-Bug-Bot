# =============================================================================
# k8s/deployment.yaml — Bug Bot Kubernetes Deployment
# =============================================================================
#
# Deploys a single replica of the Discord Trello Bug Bot.
#
# Prerequisites:
#   1. The "arcascian-tools" namespace must exist (see namespace.yaml).
#   2. The "arcascian-bugbot-secrets" Secret must contain the five
#      required environment variables (see secret.example.yaml).
#   3. The container image must be pushed to the registry.
#
# Apply with:
#   kubectl apply -f k8s/deployment.yaml
#
# The bot makes outbound connections to Discord and Trello, and
# listens for inbound webhooks on port 8080. A Service is required
# to expose the webhook listener.
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: arcascian-bugbot
  namespace: arcascian-tools
  labels:
    app: arcascian-bugbot
spec:
  # A single replica is sufficient — the bot maintains one persistent
  # WebSocket connection to the Discord gateway. Running multiple
  # replicas would cause duplicate card creation.
  replicas: 1

  selector:
    matchLabels:
      app: arcascian-bugbot

  template:
    metadata:
      labels:
        app: arcascian-bugbot
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      imagePullSecrets:
        - name: ghcr-secret
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 1.1.1.1
          - 8.8.8.8
      containers:
        - name: bugbot

          # ── Container image ───────────────────────────────────────────
          # Replace YOUR_ORG with your GitHub organisation or username.
          image: ghcr.io/piledriver-playhouse/discord-trello-bug-bot:latest
          imagePullPolicy: Always

          # ── Environment variables ─────────────────────────────────────
          # All required and optional env vars are injected from the
          # Kubernetes Secret in one go.
          envFrom:
            - secretRef:
                name: arcascian-bugbot-secrets

          # ── Ports ─────────────────────────────────────────────────────
          ports:
            - name: webhook
              containerPort: 8080
              protocol: TCP

          # ── Resource limits ───────────────────────────────────────────
          # The bot is lightweight (Python + WebSocket + occasional HTTP
          # POST). These limits keep it well within small-node budgets.
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
