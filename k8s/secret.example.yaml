# =============================================================================
# k8s/secret.example.yaml — Example Kubernetes Secret
# =============================================================================
#
# ⚠️  WARNING: Do NOT commit real secrets to version control.
#
# This file is an EXAMPLE only. It shows the expected Secret structure
# with base64-encoded placeholder values ("replace_me" → cmVwbGFjZV9tZQ==).
#
# In practice, create the Secret using kubectl so credentials never
# touch a file on disk:
#
#   kubectl -n bugbot create secret generic bugbot-secrets \
#     --from-literal=DISCORD_TOKEN='...' \
#     --from-literal=BUG_CHANNEL_ID='...' \
#     --from-literal=TRELLO_API_KEY='...' \
#     --from-literal=TRELLO_TOKEN='...' \
#     --from-literal=TRELLO_LIST_ID='...'
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: bugbot-secrets
  namespace: bugbot
# Opaque is the default Secret type for arbitrary key-value pairs.
type: Opaque
data:
  # Base64-encoded placeholder values. Replace with real base64-encoded
  # credentials, or better yet, use `kubectl create secret` (see above).
  DISCORD_TOKEN: cmVwbGFjZV9tZQ==       # echo -n 'replace_me' | base64
  BUG_CHANNEL_ID: cmVwbGFjZV9tZQ==      # echo -n 'replace_me' | base64
  TRELLO_API_KEY: cmVwbGFjZV9tZQ==      # echo -n 'replace_me' | base64
  TRELLO_TOKEN: cmVwbGFjZV9tZQ==        # echo -n 'replace_me' | base64
  TRELLO_LIST_ID: cmVwbGFjZV9tZQ==      # echo -n 'replace_me' | base64
