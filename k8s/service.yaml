# =============================================================================
# k8s/service.yaml — Bug Bot Webhook Service
# =============================================================================
#
# Exposes the bot's internal webhook listener port (8080) to the cluster.
#
# To receive notifications from Trello, you will need to expose this
# Service to the internet via an Ingress or a tool like Tailscale Funnel.
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: arcascian-bugbot
  namespace: arcascian-tools
  labels:
    app: arcascian-bugbot
spec:
  type: ClusterIP
  selector:
    app: arcascian-bugbot
  ports:
    - name: webhook
      port: 80
      targetPort: webhook
      protocol: TCP
